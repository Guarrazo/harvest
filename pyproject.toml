[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "night-city-interior-generator"
version = "0.21.1"
description = "Procedural interior generation and Object Spawner export pipeline for Cyberpunk 2077"
requires-python = ">=3.11"

[project.scripts]
ncig = "ncig.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

